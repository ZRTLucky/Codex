<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: https://raw.githubusercontent.com https://*.github.io; img-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>模型预览</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./motion.css">
<script type="module" src="./app.mjs"></script>
</head>
<body>
<main>
<header><span class="eyebrow">私密模型 · 浏览器解密</span><h1 id="title">模型预览</h1><p id="note">输入单独收到的访问密钥，解锁本次预览。</p></header>
<section id="gate" aria-label="解锁预览">
<form id="unlock-form" autocomplete="off">
<label for="access-key">访问密码或密钥</label>
<div class="unlock-row"><input id="access-key" type="password" autocomplete="off" spellcheck="false" autocapitalize="none" placeholder="输入访问密码，或粘贴 RP1. 密钥" required><button id="unlock" type="submit">解锁预览</button></div>
<label class="remember-choice"><input id="remember-device" type="checkbox">记住此设备，下次自动解锁</label>
</form>
<p class="hint">密码只在浏览器内用于解密，不随下载请求发送。请仅在自己的设备上勾选记住。</p>
</section>
<section id="preview" hidden aria-label="模型查看器">
<nav><div id="models" aria-label="模型切换"></div><div><button id="reset" type="button">恢复视角</button><button id="lock" type="button">锁定预览</button></div></nav>
<div id="view-modes" class="view-modes" role="group" aria-label="查看方式" hidden><button id="mode-assembly" type="button" class="active" aria-pressed="true">装配体</button><button id="mode-single" type="button" aria-pressed="false">独立零件</button></div>
<div id="part-picker" hidden><label for="part-select">选择零件</label><select id="part-select"></select></div>
<model-viewer id="viewer" camera-controls touch-action="pan-y" shadow-intensity="0" exposure="1" camera-orbit="35deg 65deg auto" min-camera-orbit="auto auto 5%" max-camera-orbit="auto auto 500%" interaction-prompt="none" loading="eager" alt="三维模型预览"></model-viewer>
<model-viewer id="part-viewer" camera-controls touch-action="pan-y" shadow-intensity="0" exposure="1" camera-orbit="35deg 65deg auto" min-camera-orbit="auto auto 5%" max-camera-orbit="auto auto 500%" interaction-prompt="none" loading="eager" alt="独立零件预览" hidden></model-viewer>
<div id="motion" hidden>
<div id="motion-modes" class="motion-buttons" hidden></div>
<div class="motion-settings"><label for="motion-duration">单程时间</label><select id="motion-duration"><option value="1">1秒</option><option value="3" selected>3秒</option><option value="5">5秒</option></select></div>
<div class="motion-buttons"><button id="motion-low" type="button">起点</button><button id="motion-high" type="button">终点</button><button id="motion-play" type="button">往返播放</button></div>
<label for="motion-progress">运动进度</label><input id="motion-progress" type="range" min="0" max="1000" step="1" value="0"><output id="motion-status" for="motion-progress">进度 0%</output>
</div>
<details id="part-visibility" open hidden><summary>零件显隐 <span id="part-count"></span></summary><div id="part-list"></div></details>
<p class="hint">拖动旋转 · 双指缩放 / 平移</p>
</section>
<p id="status" role="status" aria-live="polite">等待输入访问密钥</p>
<p id="device-status" class="hint"></p><button id="forget-device" type="button" hidden>忘记此设备</button>
<footer>网格预览不用于精确测量。请仅向获准查看的人提供访问密钥。</footer>
</main>
</body>
</html>
