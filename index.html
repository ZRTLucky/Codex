<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: https://raw.githubusercontent.com https://*.github.io; img-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>模型预览</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./motion.css">
<script type="module" src="./app.mjs"></script>
</head>
<body>
<main>
<header><span class="eyebrow">私密模型 · 浏览器解密</span><h1 id="title">模型预览</h1><p id="note">输入单独收到的访问密钥，解锁本次预览。</p></header>
<section id="gate" aria-label="解锁预览">
<form id="unlock-form" autocomplete="off">
<label for="access-key">访问密码或密钥</label>
<div class="unlock-row"><input id="access-key" type="password" autocomplete="off" spellcheck="false" autocapitalize="none" placeholder="输入访问密码，或粘贴 RP1. 密钥" required><button id="unlock" type="submit">解锁预览</button></div>
<label class="remember-choice"><input id="remember-device" type="checkbox">记住此设备，下次自动解锁</label>
</form>
<p class="hint">密码只在浏览器内用于解密，不随下载请求发送。请仅在自己的设备上勾选记住。</p>
</section>
<section id="preview" hidden aria-label="模型查看器">
<nav><div><button id="reset" type="button">恢复视角</button><button id="lock" type="button">锁定预览</button></div></nav>
<div id="view-modes" class="view-modes" role="group" aria-label="查看方式" hidden><button id="mode-assembly" type="button" class="active" aria-pressed="true">装配体</button><button id="mode-single" type="button" aria-pressed="false">独立零件</button></div>
<div id="mechanism-picker" class="linkage-panel" hidden><div class="linkage-heading">联动板块 <span id="mechanism-current">请选择联动</span></div><div id="mechanisms" role="group" aria-label="联动激活选项"></div><p id="linkage-note" class="hint"></p></div>
<details id="part-picker" class="picker" open hidden><summary>零件选择 <span id="part-selection-count"></span></summary><div id="part-select" class="part-buttons" role="group" aria-label="独立零件选择"></div><span id="part-current" hidden></span><div id="relation-picker" hidden><span id="relation-current"></span><div id="relation-options"></div></div></details>
<p id="parts-empty" class="hint" hidden>尚未选择零件，请点击上方按钮选择。</p>
<model-viewer id="viewer" camera-controls zoom-sensitivity="0.25" touch-action="pan-y" shadow-intensity="0" exposure="1" camera-orbit="35deg 65deg auto" min-camera-orbit="auto auto 5%" max-camera-orbit="auto auto 500%" interaction-prompt="none" loading="eager" alt="三维模型预览"></model-viewer>
<model-viewer id="part-viewer" camera-controls zoom-sensitivity="0.25" touch-action="pan-y" shadow-intensity="0" exposure="1" camera-orbit="35deg 65deg auto" min-camera-orbit="auto auto 5%" max-camera-orbit="auto auto 500%" interaction-prompt="none" loading="eager" alt="独立零件预览" hidden></model-viewer>
<div id="display-picker" class="assembly-panel" hidden><div class="linkage-heading">装配板块 <span id="display-current">组装</span></div><div class="assembly-settings"><label for="assembly-duration">单程时间</label><select id="assembly-duration"><option value="1" selected>1秒</option><option value="3">3秒</option><option value="5">5秒</option></select></div><div class="motion-buttons" role="group" aria-label="装配操作"><button type="button" data-presentation="assembly" aria-pressed="true">组装</button><button type="button" data-presentation="explode" aria-pressed="false">分离</button></div><p id="assembly-note" class="hint" hidden>补充零件按各自建模坐标展示，整机安装位置待核对。</p></div>
<div id="motion" hidden>
<div id="motion-modes" hidden></div>
<div class="motion-settings"><label for="motion-duration">单程时间</label><select id="motion-duration"><option value="1" selected>1秒</option><option value="3">3秒</option><option value="5">5秒</option></select></div>
<div id="linkage-actions" class="motion-buttons"><button id="motion-trigger" type="button">联动</button><button id="motion-reset" type="button">复位</button></div>
<label for="motion-progress">运动进度</label><input id="motion-progress" type="range" min="0" max="1000" step="1" value="0"><output id="motion-status" for="motion-progress">进度 0%</output>
</div>
<details id="part-visibility" hidden><summary>零件显隐 <span id="part-count"></span></summary><div id="part-list"></div></details>
<p class="hint">拖动旋转 · 双指缩放 / 平移</p>
</section>
<p id="status" role="status" aria-live="polite">等待输入访问密钥</p>
<p id="device-status" class="hint"></p><button id="forget-device" type="button" hidden>忘记此设备</button>
<footer>网格预览不用于精确测量。请仅向获准查看的人提供访问密钥。</footer>
</main>
</body>
</html>
